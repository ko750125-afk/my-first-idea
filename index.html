<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Message | 오늘도 힘내세요</title>
    <meta name="description" content="매일 힘을 주는 소중한 응원의 메시지">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-container">
            <h2 class="header-title">
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                나의 첫 서비스
            </h2>
            <nav class="nav-menu">
                <a href="#">소개</a>
                <a href="#">기능</a>
                <a href="#">문의</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="container">
                <div class="content-card">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        ACTIVE MESSAGE
                    </div>
                    <h1 id="main-title">오늘도 힘내세요</h1>
                    <p class="sub-text">KEEP GOING FORWARD</p>
                    <button class="next-btn btn-blue" id="next-btn">다음문장보기</button>
                </div>
            </div>
        </section>

        <section class="reviews-section">
            <div class="section-container">
                <h2 class="section-title">사용자 후기</h2>
                <div class="reviews-grid">
                    <div class="review-card">
                        <div class="review-header">
                            <img src="https://i.pravatar.cc/150?u=user1" alt="User 1" class="profile-img">
                            <div class="user-info">
                                <span class="user-name">김민수</span>
                                <span class="user-role">프리랜서 디자이너</span>
                            </div>
                        </div>
                        <p class="review-text">"매일 아침 이 페이지를 보며 하루를 시작해요. 작은 응원이 정말 큰 힘이 됩니다. 디자인도 너무 깔끔해서 좋아요!"</p>
                    </div>
                    <div class="review-card">
                        <div class="review-header">
                            <img src="https://i.pravatar.cc/150?u=user2" alt="User 2" class="profile-img">
                            <div class="user-info">
                                <span class="user-name">이지현</span>
                                <span class="user-role">IT 엔지니어</span>
                            </div>
                        </div>
                        <p class="review-text">"개발 공부하다가 지칠 때마다 버튼을 눌러보는데, 메시지 하나하나가 정말 따뜻하게 다가옵니다. 강력 추천해요."</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 My Service
    </footer>

    <script>
        const messages = [
            "오늘도 힘내세요",
            "오늘도 해냈어요!",
            "조금씩 나아지고 있어요",
            "이대로 계속 가봅시다"
        ];
        let currentIndex = 0;

        const titleElement = document.getElementById('main-title');
        const nextBtn = document.getElementById('next-btn');

        nextBtn.addEventListener('click', () => {
            // Cycle to the next index
            currentIndex = (currentIndex + 1) % messages.length;

            // Update button color based on index
            const colors = ['btn-blue', 'btn-yellow', 'btn-orange', 'btn-green'];
            colors.forEach(cls => nextBtn.classList.remove(cls));
            nextBtn.classList.add(colors[currentIndex]);

            // Apply text change with a simple animation reset
            titleElement.style.animation = 'none';
            titleElement.offsetHeight; // trigger reflow
            titleElement.innerText = messages[currentIndex];
            titleElement.style.animation = 'fadeInUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards';
        });
    </script>
</body>

</html>
